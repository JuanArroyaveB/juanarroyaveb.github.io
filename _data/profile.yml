bio:
  - en: "I am a probabilist interested in the rigorous mathematical analysis of stochastic systems and the collective behavior that emerges from them."
    pt: "Sou probabilista e me interesso pela análise matemática rigorosa de sistemas estocásticos e pelo comportamento coletivo que emerge deles."
    es: "Soy probabilista y me interesa el análisis matemático riguroso de sistemas estocásticos y el comportamiento colectivo que emerge de ellos."
  - en: "I am currently in the final year of my PhD in Mathematics at the Instituto Nacional de Matemática Pura e Aplicada (IMPA), under the supervision of Professor Milton Jara. I also work as a Substitute Professor at Universidade Federal Fluminense (UFF)."
    pt: "Atualmente estou no último ano do doutorado em Matemática no Instituto Nacional de Matemática Pura e Aplicada (IMPA), sob orientação do Professor Milton Jara. Também atuo como Professor Substituto na Universidade Federal Fluminense (UFF)."
    es: "Actualmente estoy en el último año del doctorado en Matemáticas en el Instituto Nacional de Matemática Pura e Aplicada (IMPA), bajo la supervisión del Profesor Milton Jara. También trabajo como Profesor Sustituto en la Universidade Federal Fluminense (UFF)."
  - en: "I earned my Master's degree in Mathematics from Universidade Federal da Bahia in 2021, advised by Professor Tertuliano Franco, and my Bachelor's degree from Universidad de Antioquia in Medellín, Colombia."
    pt: "Concluí o mestrado em Matemática na Universidade Federal da Bahia em 2021, sob orientação do Professor Tertuliano Franco, e a graduação na Universidad de Antioquia, em Medellín, Colômbia."
    es: "Obtuve mi maestría en Matemáticas en la Universidade Federal da Bahia en 2021, bajo la orientación del Profesor Tertuliano Franco, y mi pregrado en la Universidad de Antioquia, en Medellín, Colombia."

